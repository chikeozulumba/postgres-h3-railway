name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: postgres-h3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and verify
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=testdb \
            ${{ env.IMAGE_NAME }}:test
          # Wait for PostgreSQL to be ready
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U testuser -d testdb 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker exec pg pg_isready -U testuser -d testdb
          # Verify extensions (init scripts run on first start)
          EXTS=$(docker exec pg psql -U testuser -d testdb -t -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis', 'h3');")
          echo "$EXTS" | grep -q postgis && echo "$EXTS" | grep -q h3
          docker stop pg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Required: repo Secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets['DOCKERHUB_USERNAME'] }}
          password: ${{ secrets['DOCKERHUB_TOKEN'] }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets['DOCKERHUB_USERNAME'] }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets['DOCKERHUB_USERNAME'] }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
